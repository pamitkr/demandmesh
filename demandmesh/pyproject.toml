[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demandmesh"
version = "1.0.0"
description = "Hyper-local B2B demand forecasting and dynamic route optimisation for Indian industrial clusters"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pamit Kumar" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.7,<2",
    "joblib>=1.3",
    "matplotlib>=3.8,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
demandmesh-pipeline = "demandmesh.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Query(...) defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["demandmesh", "support"]
